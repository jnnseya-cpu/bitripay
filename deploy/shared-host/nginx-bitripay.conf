# BitriPay behind an existing Nginx on a shared VPS. Copy to /etc/nginx/sites-available/bitripay.conf, enable it,
# then obtain certificates with certbot (it rewrites these blocks for HTTPS):
#   ln -s /etc/nginx/sites-available/bitripay.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bitripay.com -d www.bitripay.com -d admin.bitripay.com -d api.bitripay.com
# Ports match BITRIPAY_WEB_PORT / BITRIPAY_ADMIN_PORT / BITRIPAY_API_PORT (defaults 8080 / 8081 / 4000).
# The web and admin containers already route /api, /v1 and the site pages to the API themselves.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  listen [::]:80;
  server_name bitripay.com;
  return 301 https://www.bitripay.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.bitripay.com;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.bitripay.com;
  client_max_body_size 25m;
  add_header X-Robots-Tag noindex always;
  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.bitripay.com;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
