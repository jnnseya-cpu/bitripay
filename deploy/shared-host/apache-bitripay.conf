# BitriPay behind an existing Apache on a shared VPS. Copy to /etc/apache2/sites-available/bitripay.conf, then:
#   a2enmod proxy proxy_http proxy_wstunnel headers && a2ensite bitripay && apachectl configtest && systemctl reload apache2
#   certbot --apache -d bitripay.com -d www.bitripay.com -d admin.bitripay.com -d api.bitripay.com
# Ports match BITRIPAY_WEB_PORT / BITRIPAY_ADMIN_PORT / BITRIPAY_API_PORT (defaults 8080 / 8081 / 4000).

<VirtualHost *:80>
  ServerName www.bitripay.com
  Redirect permanent / https://bitripay.com/
</VirtualHost>

<VirtualHost *:80>
  ServerName bitripay.com
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
  ProxyPass / http://127.0.0.1:8080/
  ProxyPassReverse / http://127.0.0.1:8080/
  LimitRequestBody 26214400
</VirtualHost>

<VirtualHost *:80>
  ServerName admin.bitripay.com
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
  Header always set X-Robots-Tag "noindex"
  ProxyPass / http://127.0.0.1:8081/
  ProxyPassReverse / http://127.0.0.1:8081/
  LimitRequestBody 26214400
</VirtualHost>

<VirtualHost *:80>
  ServerName api.bitripay.com
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
  ProxyPass / http://127.0.0.1:4000/
  ProxyPassReverse / http://127.0.0.1:4000/
  LimitRequestBody 26214400
</VirtualHost>
