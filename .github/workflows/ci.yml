name: verify
on:
  push:
  pull_request:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SKIP_MOBILE=1 npm run verify
      - run: npm run format:check
      - run: npm run deps:check
      - run: npm audit --omit=dev --audit-level=high
      - name: mobile and payout device typecheck
        run: |
          (cd frontend/mobile && npm ci && npm run typecheck)
          (cd frontend/payout-device && npm ci && npm run typecheck && npm test)

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { file: backend/api/Dockerfile, name: api }
          - { file: frontend/web/Dockerfile, name: web }
          - { file: frontend/admin/Dockerfile, name: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          load: true
          tags: bitripay/${{ matrix.image.name }}:ci
      - name: Validate the nginx configuration of the web and admin images
        if: matrix.image.name != 'api'
        run: docker run --rm --add-host api:127.0.0.1 bitripay/${{ matrix.image.name }}:ci nginx -t
      - name: Start the API image in production mode and check its health
        if: matrix.image.name == 'api'
        run: |
          docker run -d --name api-ci -p 4000:4000 -e NODE_ENV=production -e WEB_URL=https://www.bitripay.com -e ADMIN_URL=https://admin.bitripay.com -e API_URL=https://api.bitripay.com \
            -e JWT_SECRET=$(openssl rand -hex 32) -e APP_SECRET=$(openssl rand -hex 32) -e ADMIN_PASSWORD=$(openssl rand -hex 12) bitripay/api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/health && exit 0; sleep 2; done
          docker logs api-ci
          exit 1
  sdk-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer validate --strict
        working-directory: shared/sdk-php
      - run: for f in $(find shared/sdk-php/src integrations/woocommerce-bitripay -name '*.php'); do php -l "$f"; done
  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e shared/sdk-python
      - run: python -m compileall -q shared/sdk-python/bitripay
