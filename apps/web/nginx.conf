server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /v1/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
  # Server-rendered marketing pages, feeds and crawler files come from the API so search engines, social previews and AI answer engines get complete HTML.
  location ~ ^/(lite|blog|legal|about|contact|sitemap\.xml|feed\.xml|robots\.txt|llms\.txt|llms-full\.txt|[A-Za-z0-9]{8,64}\.txt)(/|$) { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { try_files $uri $uri/ /index.html; }
}
