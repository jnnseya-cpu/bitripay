# Production-style composition. Secrets are required: `docker compose up` refuses to start until JWT_SECRET,
# APP_SECRET and ADMIN_PASSWORD are set in the environment or a .env file next to this compose file.
services:
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_URL: ${WEB_URL:-http://localhost:8080}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8081}
      API_URL: ${API_URL:-http://localhost:4000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of at least 32 characters}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET to a random string of at least 32 characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bitripay.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to a strong password (12+ characters)}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      DATABASE_PATH: /data/bitripay.db
    volumes:
      - api-data:/data
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
  admin:
    build:
      context: .
      dockerfile: frontend/admin/Dockerfile
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  api-data:
