server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /v1/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
  # Server-rendered marketing pages, feeds and crawler files come from the API so search engines, social previews and AI answer engines get complete HTML.
  # The regex contains braces, so nginx needs it quoted.
  location ~ "^/(brand|lite|blog|legal|about|contact|how-it-works|industries|enterprise|developers|features|get-started|growth|policies|status|status\.json|sitemap\.xml|feed\.xml|robots\.txt|llms\.txt|llms-full\.txt|[A-Za-z0-9]{8,64}\.txt)(/|$)" { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # Hosted checkout is embedded cross-origin by @bitripay/checkout-js, so it must not inherit a same-origin framing
  # rule from any proxy in front. Stated here too: this image is also served directly in the shared-host deployment.
  location ~ "^/checkout(/|$)" {
    add_header X-Frame-Options "";
    add_header Content-Security-Policy "frame-ancestors https:";
    try_files $uri $uri/ /index.html;
  }
  location / { try_files $uri $uri/ /index.html; }
}
